# Configuração do script de deploy via SSH (systemd de usuário + Caddy com HTTPS). Veja a seção Deploy do README.
# O script lê CHAVE=valor linha a linha, sem executar o arquivo: cada valor fica numa linha só e os comentários, em
# linhas próprias. Variáveis aceitas nos valores: {root} {data} {port} {domain} {url}.

# Nome do serviço (systemd) e da pasta do app na VPS (/srv/fellowsupport).
APP=fellowsupport

# deploy.sh local: venv com Python 3.12, dependências de produção e uvicorn com recarga automática.
# A porta vem do PORT do .env (o mesmo que o app lê; padrão 9713). A venv existente é reaproveitada, e não recriada.
DEV="[ -x .venv/bin/python ] || uv venv .venv --python 3.12; uv pip install --python .venv/bin/python -r requirements.txt && exec .venv/bin/uvicorn app.adapters.api.main:app --host 127.0.0.1 --port ${PORT:-9713} --reload --reload-dir app"

# Roda na máquina de quem publica, antes de empacotar: o servidor não precisa de Node. O pacote leva os arquivos
# versionados no git e, além deles, o que o INCLUDE traz (frontend/dist é ignorado pelo git). Nunca leva o .env.
BUILD="cd frontend && npm ci && npm run build"
INCLUDE=frontend/dist

# Fora do pacote: o que o servidor não usa (documentação, testes, scripts, exemplos curados, CI, código-fonte do front).
EXCLUDE="docs tests scripts samples .github frontend/src PROMPT_ENGINEERING_NOTES.md"

# Na VPS: venv com Python 3.12 e só as dependências de produção (sem pytest nem ruff).
INSTALL="uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -r requirements.txt"

# Um único worker (o limite de taxa por IP é em memória; ADR 0033). O Caddy chega por 127.0.0.1 e é o único proxy
# confiável para o X-Forwarded-For.
RUN=".venv/bin/uvicorn app.adapters.api.main:app --host 127.0.0.1 --port {port} --workers 1 --proxy-headers --forwarded-allow-ips 127.0.0.1 --no-server-header"

# Rota que responde 200 quando o app está de pé: o deploy a confere e volta a versão anterior se falhar.
HEALTH=/healthz

# Sem esta variável no .env enviado (ou já na VPS), o deploy para antes de mudar qualquer coisa.
# OPENROUTER_API_KEY fica vazia no deploy para cada usuário inserir a sua na sessão; ADMIN_API_KEY protege o catálogo/prompts.
REQUIRED="ADMIN_API_KEY"

# Limite de memória do serviço.
MEMORY_MAX=300M

# Ambiente do serviço. DATA_DIR aponta para a pasta persistente da VPS ({data}), fora das versões: o histórico e o
# cache sobrevivem a novos deploys. PUBLIC_URL é o endereço público (vazio sem domínio).
SERVICE_ENV="DATA_DIR={data} PUBLIC_URL={url} PYTHONUNBUFFERED=1"
